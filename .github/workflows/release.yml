name: Release
on:
  push:
    tags: ["v*"]
  # Build and sign without publishing, so the release path can be exercised
  # without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # A tag push does not run the CI workflow, so re-verify here rather than
  # publishing on the assumption that main was green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Test with coverage gate
        run: ./scripts/coverage.sh

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64 }
          # darwin targets build on macOS because codesign exists only there.
          # A Mach-O binary cross-compiled on Linux carries no signature, and
          # Apple Silicon refuses to execute it (OS_REASON_CODESIGNING).
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "proem-${GOOS}-${GOARCH}" ./cmd/proem

      - name: Sign (macOS)
        if: matrix.goos == 'darwin'
        run: |
          bin="proem-${{ matrix.goos }}-${{ matrix.goarch }}"
          # Ad-hoc signature: enough for the binary to execute on Apple
          # Silicon. It is not notarised, so a browser download still carries
          # a quarantine flag the user must clear.
          codesign --sign - --force --timestamp=none "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign --display --verbose=2 "$bin" 2>&1 | grep -q 'Signature=adhoc' \
            || { echo "binary is not ad-hoc signed"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: proem-${{ matrix.goos }}-${{ matrix.goarch }}
          path: proem-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: proem-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          chmod +x proem-*
          sha256sum proem-* > checksums.txt
          cat checksums.txt

      - name: Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/proem-*
            dist/checksums.txt
          generate_release_notes: true
