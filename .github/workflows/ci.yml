name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: Test with coverage gate
        run: ./scripts/coverage.sh
      - run: go build -o /tmp/pro-ant ./cmd/proxy
      - name: Smoke test the binary
        run: |
          cp pool.yaml.example pool.yaml
          CLAUDE_OAT_A=t CLAUDE_OAT_B=t OPENROUTER_KEY=t \
            /tmp/pro-ant --config pool.yaml --redis-url redis://localhost:6379/0 \
            --listen :18080 --metrics-addr :19090 &
          for i in $(seq 1 50); do
            curl -fsS http://localhost:18080/health && break || sleep 0.2
          done
          curl -fsS http://localhost:18080/health | grep -q ok
          curl -fsS http://localhost:19090/metrics | grep -q proant_
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pro-ant:ci
